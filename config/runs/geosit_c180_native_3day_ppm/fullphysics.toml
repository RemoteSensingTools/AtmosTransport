# GEOS-IT native C180/L72, Dec 2-4 2021, standard split PPM + PBL diffusion
# + GEOS CMFMC/DTRAIN convection.
# Requires fresh binaries generated by config/preprocessing/geosit_c180_native_dec2021_f32.toml.

[input]
folder       = "/temp1/c180_geosit_native_v4_dec2021_f32"
start_date   = "2021-12-02"
end_date     = "2021-12-04"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[architecture]
use_gpu = true

[numerics]
float_type = "Float32"

[run]
scheme = "ppm"
reset_air_mass_each_window = true

[tracers.co2_natural]
[tracers.co2_natural.init]
kind = "catrine_co2"

[tracers.co2_fossil]
[tracers.co2_fossil.init]
kind = "uniform"
background = 0.0

[tracers.co2_fossil.surface_flux]
kind       = "gridfed_fossil_co2"
file       = "/home/cfranken/data/AtmosTransport/catrine/Emissions/gridfed/GCP-GridFEDv2024.0_2021.short.nc"
time_index = 12

[diffusion]
kind = "pbl"

[convection]
kind = "cmfmc"

[output]
snapshot_hours = [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72]
snapshot_file  = "/temp1/c180_geosit_native_3d/fullphysics_ppm.nc"
