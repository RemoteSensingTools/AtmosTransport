# 4-tracer convection-comparison experiment, GCHP-CMFMC side.
#
# CS180 GEOS-IT/L72, Dec 2-4 2021, NoAdvection + NoDiffusion + CMFMC
# convection (DTRAIN forcing). Same 4-tracer single-layer IC as the
# TM5 sibling config (`convonly_tm5_era5_c180_3day.toml`); only the
# convection scheme and met source differ.
#
# Note: this binary uses a different vertical resolution (Nz=72,
# merged to 0.25 hPa) than the ERA5 sibling (Nz=85, cfl85), so the
# layer indices for tracer_p08 / p06 / p04 will differ. The
# pressure_layer IC picks per-column k by log-midpoint p, so the
# tracers still target the same fraction of column pressure even
# across L72 / L85.
#
# Runner:
#   ATMOSTR_TIMERS=1 julia --project=. scripts/run_transport.jl \
#       config/runs/convection_compare_4tracer/convonly_cmfmc_geosit_c180_3day.toml

[input]
folder       = "/home/cfranken/data/AtmosTransport/met/geosit/C180/transport_binary_v4_merge025hpa_adaptive_f32"
start_date   = "2021-12-02"
end_date     = "2021-12-04"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[advection]
scheme = "none"

[diffusion]
kind = "none"

[convection]
kind = "cmfmc"

[tracers.co2_lowest_layer]
[tracers.co2_lowest_layer.init]
kind = "pressure_layer"
lowest_layer = true
total_molecules = 1.0e22

[tracers.co2_p08]
[tracers.co2_p08.init]
kind = "pressure_layer"
psurf_fraction = 0.8
total_molecules = 1.0e22

[tracers.co2_p06]
[tracers.co2_p06.init]
kind = "pressure_layer"
psurf_fraction = 0.6
total_molecules = 1.0e22

[tracers.co2_p04]
[tracers.co2_p04.init]
kind = "pressure_layer"
psurf_fraction = 0.4
total_molecules = 1.0e22

[output]
cadence_hours = 1.0
snapshot_file = "/temp1/convection_compare_4tracer/convonly_cmfmc_geosit_c180_3day.nc"
