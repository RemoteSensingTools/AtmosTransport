# ===========================================================================
# ERA5 native N320 GRIB → C180 GEOS-native cubed-sphere preprocess
# (Dec 2021 Catrine validation).
#
# Drives the unified CLI:
#   julia -t 8 --project=. scripts/preprocessing/preprocess_transport_binary.jl \
#       config/preprocessing/era5_n320_to_c180_dec2021_catrine_f32.toml \
#       --start 2021-12-01 --end 2021-12-31
#
# Per-window pipeline (B/C/D/E from `sources/era5.jl`, wired in
# `transport_binary/era5_n320_regrid.jl`):
#
#   1. Spectral synthesis of VO + D → U/V, T, LNSP → PS on the N320 mesh
#   2. Q read directly from `gridType = reduced_gg`
#   3. Hybrid-σ dry-mass derivation (matches the GEOS endpoint convention)
#   4. Convective forecast UDMF/DDMF/UDRF/DDRF on the N320 mesh
#      (currently read-only — conversion to CMFMC/DTRAIN or TM5
#      entu/detu/entd/detd is a follow-on; see CATRINE_DEC2021_VALIDATION)
#   5. Conservative regrid of PS / U / V / T / Q from N320 to C180
#   6. Panel-local wind rotation + Arakawa-C face flux reconstruction
#   7. Per-window Poisson balance closing the mass-tendency continuity
#   8. Streaming write through the v4 transport-binary writer
#
# Source-descriptor knobs (include_surface / include_convection /
# include_vdiff_fields) live in `config/met_sources/era5_n320.toml`.
#
# Validation target: Catrine GEOS-Chem snapshots at
# `~/data/AtmosTransport/catrine-geoschem-runs/` (which are C180 × L72).
# ===========================================================================

[source]
toml     = "config/met_sources/era5_n320.toml"
root_dir = "/home/cfranken/data/AtmosTransport/met/era5/N320/hourly/raw"

[vertical]
coefficients_file = "config/era5_L137_coefficients.toml"

[output]
directory  = "/home/cfranken/data/AtmosTransport/met/era5/n320_to_c180/transport_binary_dec2021_catrine_f32"
mass_basis = "dry"

[grid]
type                = "cubed_sphere"
Nc                  = 180
panel_convention    = "geos_native"
definition          = "gmao"
regridder_cache_dir = "~/.cache/AtmosTransport/cr_regridding"

[numerics]
float_type     = "Float32"
dt_met_seconds = 3600.0
