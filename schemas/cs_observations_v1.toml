# ---------------------------------------------------------------------------
# cs_observations_v1 — NetCDF schema for point observations consumed by the
# Plan 26 CS 4D-Var inversion path.
#
# Single-file format. One unlimited dimension `obs` plus a fixed-size
# `date_component` dimension of length 6 (year, month, day, hour, minute,
# second). All observations carry geophysical coordinates (lat, lon, alt),
# scalar value + sigma, instrument label, and tracer name. Root-level
# attributes pin the schema version and the absolute time origin so date
# arithmetic on read is unambiguous.
#
# This file documents the schema; the loader/writer live in
# `src/Inversion/ObservationsIO.jl`. Any version bump must update both.
# ---------------------------------------------------------------------------

[meta]
version = "v1"
shipped_in = "Plan 26 P0.D1"
intended_for = "src/Inversion/ObservationsIO.jl read_observations / write_observations"

[dimensions]
obs            = "unlimited"
date_component = 6   # year, month, day, hour, minute, second

# All variables below are REQUIRED — the loader rejects files that omit
# any of them. `dims` is in NetCDF order (i.e. as it appears in `ncdump`),
# which is the REVERSE of Julia's column-major order.

[variables.id]
dtype = "i64"
dims  = ["obs"]
description = "unique observation identifier"

[variables.date_components]
dtype = "i16"
dims  = ["date_component", "obs"]
description = "(year, month, day, hour, minute, second) per observation"

[variables.lat]
dtype = "f32"
dims  = ["obs"]
units = "degrees_north"
description = "observation latitude"

[variables.lon]
dtype = "f32"
dims  = ["obs"]
units = "degrees_east"
description = "observation longitude"

[variables.alt]
dtype = "f32"
dims  = ["obs"]
units = "m"
description = "observation altitude above sea level"

[variables.value]
dtype = "f64"
dims  = ["obs"]
description = "observation value in the tracer's native unit (set per-tracer)"

[variables.value_sigma]
dtype = "f64"
dims  = ["obs"]
description = "1-sigma observation error in the tracer's native unit"

[variables.instrument_type]
dtype = "string"
dims  = ["obs"]
description = "instrument family label, e.g. 'TCCON', 'ICOS', 'OCO-2'"

[variables.tracer]
dtype = "string"
dims  = ["obs"]
description = "tracer name, e.g. 'CO2', 'CH4', 'CO'"

[attributes]
cs_observations_schema = "v1"   # mandatory; loader fails-fast on mismatch
time_origin = "REQUIRED: ISO-8601 string, e.g. '1900-01-01 00:00:00'"
