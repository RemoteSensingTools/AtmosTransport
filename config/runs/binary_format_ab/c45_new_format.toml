# A/B gate for the full-window flux-storage format (flux_kind contract).
# Identical run on the same Dec-2 C45 met; only the binary format differs
# (per-substep vs full-window + runtime scaling). Expected: agreement to
# F32 round-trip noise; the uniform tracer must stay uniform in both.
[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C45/transport_binary_dec2021_catrine_f32_fullL72_fullwindow_smoke"
start_date   = "2021-12-02"
end_date     = "2021-12-02"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "linrood"
order  = 7

[diffusion]
kind = "none"

[convection]
kind = "none"

[chemistry]
kind = "none"

[tracers.uniform400]
  [tracers.uniform400.init]
  kind = "uniform"
  background = 400e-6

[tracers.blob]
  [tracers.blob.init]
  kind = "gaussian_blob"
  background = 400e-6
  amplitude = 100e-6
  lon0_deg = 35.0
  lat0_deg = 0.0
  sigma_lon_deg = 12.0
  sigma_lat_deg = 12.0

[output]
snapshot_file = "~/data/AtmosTransport/output/binary_format_ab/c45_new_format.nc"
snapshot_interval_hours = 6
