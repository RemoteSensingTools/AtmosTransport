# F32 no-flux: advection + CONVECTION (cmfmc_matrix) ONLY. No diffusion/chem/flux.
# F32 twin of f64_noflux_adv_conv_dec1-4.toml. Isolates the F32 BACKGROUND
# non-conservation of convection (the cmfmc_matrix LU solve on a large background).
# Any negative drift here, riding on the 2.8e8 kg SF6 background, is what shows up
# as the ~2.5% emission "deficit". Single-tracer SF6 for speed. Uses collab-LU
# (F32 path) to match the production campaign's convection kernel exactly.
[architecture]
use_gpu = true
backend = "cuda"
[numerics]
float_type = "Float32"
[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-04"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"
[advection]
scheme = "ppm"
[tracers.sf6]
  [tracers.sf6.init]
  kind = "file"
  file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
  variable = "SF6"
[diffusion]
kind = "none"
[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 0
[chemistry]
kind = "none"
[output]
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/conservation_test/f32_noflux_adv_conv_dec1-4.nc"
