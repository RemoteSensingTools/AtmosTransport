# ===========================================================================
# Two-week CATRINE 4-tracer GEOS-IT C180 run with GCHP-like diffusion +
# CMFMC-matrix convection, driving fossil + natural CO2 + SF6 + Rn222 from
# the pinned (column-balance + global dry-air pin) Dec 1-14 2021 transport
# binaries on NAS.
#
# Same tracer/physics setup as
# `catrine_geosit_c180_v4_fullphys_dec2021_smoke3d.toml`; this config just
# extends to two weeks and writes to a 2-week NetCDF distinct from the
# 3-day smoke output.
#
# Runner:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/catrine_geosit_c180_v4_fullphys_dec2021_2weeks.toml
#
# Fossil + natural CO2 animations:
#   julia --project=. scripts/visualization/animate_catrine_map_curtains_makie.jl \
#       --at  ~/data/AtmosTransport/output/catrine_geosit_c180_v4_fullphys_dec2021_2weeks.nc \
#       --gc  ~/data/AtmosTransport/catrine-geoschem-runs \
#       --species co2_fossil  --out-dir ~/data/AtmosTransport/output/catrine_2weeks_fossil_animation
#   julia --project=. scripts/visualization/animate_catrine_map_curtains_makie.jl \
#       --at  ~/data/AtmosTransport/output/catrine_geosit_c180_v4_fullphys_dec2021_2weeks.nc \
#       --gc  ~/data/AtmosTransport/catrine-geoschem-runs \
#       --species co2_natural --out-dir ~/data/AtmosTransport/output/catrine_2weeks_natural_animation
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32"
start_date   = "2021-12-01"
end_date     = "2021-12-14"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"

[tracers.co2_fossil]
  [tracers.co2_fossil.init]
  kind = "uniform"
  background = 0.0
  [tracers.co2_fossil.surface_flux]
  kind = "gridfed_fossil_co2"
  time_index = 12

[tracers.sf6]
  [tracers.sf6.init]
  kind = "file"
  file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
  variable = "SF6"
  [tracers.sf6.surface_flux]
  kind = "edgar_sf6"
  # EDGAR-v8 (2022) gives 9.99 kt/yr; GC applied 10.10 kt/yr (same spatial
  # pattern). Scale our global total to match GC exactly (Catrine protocol
  # pins SF6 scaling). Factor = 10.1042 / 9.9877 = 1.0116635.
  scale = 1.0116635

[tracers.rn222]
  [tracers.rn222.init]
  kind = "uniform"
  background = 0.0
  [tracers.rn222.surface_flux]
  kind = "zhang_rn222"
  time_index = 12

[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = true

[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 0

[chemistry]
kind = "decay"
  [chemistry.half_lives_seconds]
  rn222 = 330350.4

[output]
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/catrine_geosit_c180_v4_fullphys_dec2021_2weeks.nc"
