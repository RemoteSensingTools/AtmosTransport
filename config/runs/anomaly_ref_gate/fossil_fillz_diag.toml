# ===========================================================================
# CAMPAIGN — GEOS-IT C180 omega_consistent + full physics, 4 tracers,
# December 2021 (winter; Jan/Feb pending emissions). The cube-native fingering cure (omega cm
# closure) driving co2_natural + co2_fossil + sf6 + rn222 against the
# GEOS-Chem reference. Emission inputs verified GO vs GC (all 4 species).
#
# REQUIRES: omega_consistent binaries for December 2021 in the [input] folder
# below (geos_cm_closure="omega_consistent" preprocessing config).
# SCOPE: December only — lmdz uses the Dec-2021 CAMS file and fossil/Rn pin the
# Dec monthly index (time_index=12); extending to Jan/Feb needs new emission
# inputs (a Jan/Feb CAMS flux file + the matching monthly indices).
#
#   julia --project=. scripts/run_transport.jl \
#       config/runs/campaign_winter2021/geosit_omega_4tracer_fullphys.toml
# ===========================================================================

[run]
air_mass_reset_mode = "none"   # air-mass carry — the ORIGINAL anomaly-transport design

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-01"        # DECEMBER scope (valid emissions + GC reference); see SCOPE note above
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "linrood"
ppm_order = 7

[tracers.co2_fossil]
  [tracers.co2_fossil.init]
  kind = "uniform"            # fossil CO2 perturbation tracer: 0 at t=0 (GC also starts at 0)
  background = 0.0
  [tracers.co2_fossil.surface_flux]
  kind = "gridfed_fossil_co2"
  time_index = 12                   # NOTE: monthly index; advance to Jan/Feb (1,2) for those months if regenerating per-month, or use a time-varying gridfed if available

[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = true

[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 0

[chemistry]
kind = "none"

[chemistry.half_lives_seconds]
  rn222 = 330350.4

[output]
snapshot_interval_hours = 3         # 3-hourly, matches GC CATRINE_inst output
snapshot_file = "~/data/AtmosTransport/output/campaign_winter2021/fossil_fillz_diag_1day.nc"
