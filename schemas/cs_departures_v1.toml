# ---------------------------------------------------------------------------
# cs_departures_v1 — NetCDF schema for one observation set's forward-pass
# simulated values, paired with the original observations to compute
# residuals in the Plan 26 CS 4D-Var inversion path.
#
# Each row is an audit record. The file preserves the full provenance
# of every kept observation (id, tracer, instrument, timestamp,
# geographic coordinates) together with the bound mesh location
# (step, panel, i, j), the observed value + sigma, the forward-pass
# simulated value, the departure, and its sigma-normalized form.
#
# Single-file format. One unlimited dimension `obs` plus a fixed-size
# `date_component` dimension of length 6. Root attributes pin the
# schema version, mesh identity, time grid, and the explicit departure
# sign convention so that read-side arithmetic is unambiguous.
#
# Departure sign convention:
#     departure = simulated_value - observed_value
# (i.e. the 4D-Var innovation `H(x) - y`). The root attribute
# `departure_sign_convention = "simulated_minus_observed"` pins this
# choice on disk; a v2 schema would have to bump the version to
# change it.
#
# This file documents the schema; the loader/writer live in
# `src/Inversion/DeparturesIO.jl`. Any version bump must update both.
# ---------------------------------------------------------------------------

[meta]
version = "v1"
shipped_in = "Plan 26 P0.D3"
intended_for = "src/Inversion/DeparturesIO.jl read_departures / write_departures"

[dimensions]
obs            = "unlimited"
date_component = 6   # year, month, day, hour, minute, second

# All variables below are REQUIRED — the loader rejects files that omit
# any of them. `dims` is in NetCDF order (i.e. as it appears in `ncdump`),
# which is the REVERSE of Julia's column-major order.

[variables.id]
dtype = "i64"
dims  = ["obs"]
description = "unique observation identifier, copied from the parent observations file"

[variables.tracer]
dtype = "string"
dims  = ["obs"]
description = "tracer name, e.g. 'CO2', 'CH4', 'CO'"

[variables.instrument_type]
dtype = "string"
dims  = ["obs"]
description = "instrument family label, e.g. 'TCCON', 'ICOS', 'OCO-2'"

[variables.date_components]
dtype = "i16"
dims  = ["date_component", "obs"]
description = "(year, month, day, hour, minute, second) per observation"

[variables.lat]
dtype = "f32"
dims  = ["obs"]
units = "degrees_north"
description = "observation latitude (copied from the parent observations file)"

[variables.lon]
dtype = "f32"
dims  = ["obs"]
units = "degrees_east"
description = "observation longitude (copied from the parent observations file)"

[variables.alt]
dtype = "f32"
dims  = ["obs"]
units = "m"
description = "observation altitude above sea level (copied from the parent observations file)"

[variables.step]
dtype = "i64"
dims  = ["obs"]
description = "bound model-step index (1 <= step <= nsteps)"

[variables.panel]
dtype = "i8"
dims  = ["obs"]
description = "bound cubed-sphere panel index, in 1:6"

[variables.i]
dtype = "i32"
dims  = ["obs"]
description = "bound cubed-sphere interior cell index along panel X (1 <= i <= Nc)"

[variables.j]
dtype = "i32"
dims  = ["obs"]
description = "bound cubed-sphere interior cell index along panel Y (1 <= j <= Nc)"

[variables.observed_value]
dtype = "f64"
dims  = ["obs"]
description = "observation value in the tracer's native unit (copied from the parent observations file)"

[variables.simulated_value]
dtype = "f64"
dims  = ["obs"]
description = "forward-pass simulated value in the tracer's native unit"

[variables.departure]
dtype = "f64"
dims  = ["obs"]
description = "departure = simulated_value - observed_value (the 4D-Var innovation H(x) - y); see departure_sign_convention root attribute"

[variables.value_sigma]
dtype = "f64"
dims  = ["obs"]
description = "1-sigma observation error (copied from the parent observations file)"

[variables.normalized_departure]
dtype = "f64"
dims  = ["obs"]
description = "departure / value_sigma — the sigma-normalized residual that enters the 4D-Var cost"

[attributes]
cs_departures_schema      = "v1"   # mandatory; loader fails-fast on mismatch
mesh_Nc                   = "REQUIRED int — mesh.Nc (the cubed-sphere panel side length in cells)"
mesh_panel_convention     = "REQUIRED string — e.g. 'GnomonicPanelConvention' or 'GEOSNativePanelConvention'"
mesh_cs_definition_tag    = "REQUIRED string — e.g. 'equiangular_gnomonic', 'gmao_equal_distance', or 'custom'"
t_start                   = "REQUIRED ISO-8601 string for the model start time"
dt_seconds                = "REQUIRED f64 — model step length in seconds"
nsteps                    = "REQUIRED int — number of model steps in this run"
departure_sign_convention = "simulated_minus_observed"
run_id                    = "OPTIONAL string — caller-supplied attribution tag"
iteration                 = "OPTIONAL int — 4D-Var iteration counter"
