# ===========================================================================
# DIURNAL-CYCLE TEST — NEW time-varying surface-flux convention.
#
# 2-day (Dec 1-2 2021) full-physics omega run, single tracer co2_natural,
# with the lmdz_co2 surface flux applied as a TIME-VARYING (3-hourly CAMS)
# series using the mass-conserving ConservativeMean temporal scheme. Hourly
# output so the tropical PBL diurnal CO2 cycle is resolved. Day 1 is spin-up;
# the diurnal diagnostic uses day 2 (Dec 2).
#
# Pair: ..._OLD_constant_dec1-2.toml (monthly-mean constant flux control).
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-02"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"
  time_varying = true
  temporal_scheme = "stepwise"      # piecewise-constant hold = GC/HEMCO's exact CAMS treatment

[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = true

[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 0

[chemistry]
kind = "none"

[output]
format = "netcdf"
split = "single"
snapshot_interval_hours = 1
path = "~/data/AtmosTransport/output/diurnal_test_dec1-2/omega_fullphys_co2nat_NEW_timevarying_dec1-2.nc"
