# F32 real-IC SF6 + EDGAR emission, isolation variant: advdiff.
# Split-flux coupling (exact emission add). Measures whether THIS operator stack
# loses the freshly-emitted increment riding on the 2.8e8 kg background.
# adv-only -> emission conserved by flux form (deficit ~ background drift only).
# advdiff/full -> if deficit jumps to ~2.5%, that added operator is the culprit.
[architecture]
use_gpu = true
backend = "cuda"
[numerics]
float_type = "Float32"
[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-02"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"
[advection]
scheme = "ppm"
[tracers.sf6]
  [tracers.sf6.init]
  kind = "file"
  file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
  variable = "SF6"
  [tracers.sf6.surface_flux]
  kind = "edgar_sf6"
  scale = 1.0116635
[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = false
[convection]
kind = "none"
[chemistry]
kind = "none"
[output]
snapshot_interval_hours = 1
snapshot_file = "~/data/AtmosTransport/output/conservation_test/f32_emit_advdiff_dec1-2.nc"
