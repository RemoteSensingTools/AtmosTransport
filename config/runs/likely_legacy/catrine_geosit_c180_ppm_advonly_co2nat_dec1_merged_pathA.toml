# ===========================================================================
# Tropopause fingering test — adv-only on the PRESSURE-FIXER cm-closure binary.
#
# Identical to catrine_geosit_c180_ppm_advonly_co2nat_dec1-5.toml except the
# input points at the pressure-fixer-cm binary (geos_cm_closure="pressure_fixer")
# and the run is Dec 1 only (24h). Compare SH-UTLS co2_natural fingering vs the
# endpoint-closure (Path-A) adv-only output at the same 24h frame.
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32"
start_date   = "2021-12-01"
end_date     = "2021-12-01"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"
  time_varying = true

[diffusion]
kind = "none"

[convection]
kind = "none"

[chemistry]
kind = "none"

[output]
format = "netcdf"
split = "single"
snapshot_interval_hours = 3
path = "~/data/AtmosTransport/output/tropopause_iso/catrine_geosit_c180_ppm_advonly_co2nat_dec1_merged_pathA.nc"
