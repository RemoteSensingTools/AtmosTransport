# Quickstart: 5° (72x37) lat-lon, 3-day advection-only, F32, Gaussian anomaly IC.
#
# Pairs with the downloadable example bundle (see
# docs/src/getting_started/quickstart.md). Pure advection — no
# diffusion, no convection, no emissions.
#
# Run:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/quickstart/ll72x37_advonly.toml

[input]
folder     = "$ATMOSTRANSPORT_DATA_ROOT_quickstart/met/era5_ll72x37_dec2021_f32/"
start_date = "2021-12-01"
end_date   = "2021-12-03"

[architecture]
use_gpu = true                  # set false for CPU-only

[numerics]
float_type = "Float32"

[run]
scheme = "slopes"               # Russell-Lerner; try "ppm" for higher order

[tracers.co2_bl]
[tracers.co2_bl.init]
kind          = "gaussian_blob"  # localized 480 ppm plume on a 400 ppm background
background    = 4.0e-4
amplitude     = 8.0e-5
lon0_deg      = -80.0
lat0_deg      = 35.0
sigma_lon_deg = 35.0
sigma_lat_deg = 18.0

[output]
snapshot_hours = [0, 6, 12, 18, 24, 30, 36, 42, 48, 54, 60, 66, 72]
snapshot_file  = "$ATMOSTRANSPORT_DATA_ROOT_quickstart/output/ll72x37_advonly.nc"
