# Route-1 tracer test — MERRA-2 wind-derived C180, adv-only co2_natural, Dec-11.
# Matched to the GEOS-native and ERA5 Dec-11 runs (same IC + surface flux + PPM,
# no diffusion/convection) so the only difference is the met binary's flux/cm.
[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/merra2/c180/transport_binary_dec2021_f32"
start_date   = "2021-12-11"
end_date     = "2021-12-11"
file_pattern = "merra2_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"
  time_varying = true

[diffusion]
kind = "none"

[convection]
kind = "none"

[chemistry]
kind = "none"

[output]
format = "netcdf"
split = "single"
snapshot_interval_hours = 3
path = "~/data/AtmosTransport/output/route1_dec11/merra2_c180_advonly_co2nat_dec11.nc"
