# 4-tracer convection-comparison experiment, TM5 side.
#
# CS180 ERA5/L85, Dec 2-4 2021, NoAdvection + NoDiffusion + TM5 convection.
# Four CO2 tracers, each initialized with a single-layer spike:
#   tracer_lowest_layer — model bottom layer (k=Nz)
#   tracer_p08, p06, p04 — layer whose log-midpoint pressure is closest
#                           to 0.8/0.6/0.4 × ps_column
# All four tracers carry the SAME total molecule count (1e22 molecules,
# arbitrary scale chosen for clean comparison), so per-tracer redistribution
# under the convection scheme can be compared directly.
#
# Hourly 3D snapshots → ~73 frames over 72 hours.
#
# Runner:
#   ATMOSTR_TIMERS=1 julia --project=. scripts/run_transport.jl \
#       config/runs/convection_compare_4tracer/convonly_tm5_era5_c180_3day.toml

[input]
folder       = "/temp1/c180_era5_geosgrid_cfl85_tm5_surface_f32_steps48_v3_20260520"
start_date   = "2021-12-02"
end_date     = "2021-12-04"
file_pattern = "era5_transport_{YYYYMMDD}_merged1000Pa_float32.bin"

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[advection]
scheme = "none"

[diffusion]
kind = "none"

[convection]
kind = "tm5"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 75

[tracers.co2_lowest_layer]
[tracers.co2_lowest_layer.init]
kind = "pressure_layer"
lowest_layer = true
total_molecules = 1.0e22

[tracers.co2_p08]
[tracers.co2_p08.init]
kind = "pressure_layer"
psurf_fraction = 0.8
total_molecules = 1.0e22

[tracers.co2_p06]
[tracers.co2_p06.init]
kind = "pressure_layer"
psurf_fraction = 0.6
total_molecules = 1.0e22

[tracers.co2_p04]
[tracers.co2_p04.init]
kind = "pressure_layer"
psurf_fraction = 0.4
total_molecules = 1.0e22

[output]
cadence_hours = 1.0
snapshot_file = "/temp1/convection_compare_4tracer/convonly_tm5_era5_c180_3day.nc"
