# F64 no-flux: co2_natural, advection + DIFFUSION + CONVECTION.
# Combined-operator control for the F32 CO2 background leak test. Uses the same
# Float32 GEOS-IT binary inputs, loaded into a Float64 runtime.
[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float64"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-04"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"

[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = false

[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = false
lmax_conv = 0

[chemistry]
kind = "none"

[output]
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/conservation_test/f64_noflux_adv_diff_conv_co2nat_dec1-4.nc"
