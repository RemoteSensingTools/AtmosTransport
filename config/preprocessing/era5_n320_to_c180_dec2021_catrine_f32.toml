# ===========================================================================
# ERA5 native N320 GRIB → C180 GEOS-native cubed-sphere preprocess
# (Dec 2021 Catrine validation).
#
# *** TARGET SPEC, NOT YET CLI-RUNNABLE. ***
#
# This file documents the production parameters intended for the future
# unified-CLI entry point. The current
# `scripts/preprocessing/preprocess_transport_binary.jl` route does NOT
# accept this config yet — `_process_day_native` requires `[source].toml`
# (a path to a met_sources descriptor) where this config uses
# `[source].name`, and there is no `preprocessor_pair_supported(
# ::CubedSphereTargetGeometry, ::ERA5GRIBSettings)` method, so
# `topology_dispatch.jl` would reject the pair even if loaded.
#
# The runnable surface today is the per-window pipeline in
# `src/Preprocessing/sources/era5.jl`:
#
#   handles  = open_era5_day(ERA5N320Settings(...), date)
#   pipeline = allocate_era5_n320_to_c180_pipeline(handles, target_grid; ...)
#   process_era5_n320_window!(pipeline, handles, date, hour)
#
# Wiring this config into the CLI requires the follow-on items listed in
# `docs/reference/CATRINE_DEC2021_VALIDATION.md` (wind rotation + face flux
# reconstruction + Poisson balance + v4 writer + process_day dispatch).
#
# Once those land, the pipeline drives:
#
#   1. Spectral synthesis of VO + D → U/V, T, LNSP → PS on the N320 mesh
#   2. Q read directly from `gridType = reduced_gg`
#   3. Hybrid-σ dry-mass derivation (matches the GEOS endpoint convention)
#   4. Convective forecast UDMF/DDMF/UDRF/DDRF on the N320 mesh
#   5. Conservative regrid of PS / U / V / T / Q from N320 to C180
#
# Validation target: Catrine GEOS-Chem snapshots at
# `~/data/AtmosTransport/catrine-geoschem-runs/` (which are C180 × L72).
# ===========================================================================

[source]
name                 = "ERA5-N320"
root_dir             = "/home/cfranken/data/AtmosTransport/met/era5/N320/hourly/raw"
include_surface      = true
include_convection   = true
include_vdiff_fields = true

[vertical]
coefficients_file = "config/era5_L137_coefficients.toml"

[output]
directory  = "/home/cfranken/data/AtmosTransport/met/era5/n320_to_c180/transport_binary_dec2021_catrine_f32"
mass_basis = "dry"

[grid]
type                = "cubed_sphere"
Nc                  = 180
panel_convention    = "geos_native"
definition          = "gmao"
regridder_cache_dir = "~/.cache/AtmosTransport/cr_regridding"

[numerics]
float_type     = "Float32"
dt_met_seconds = 3600.0
