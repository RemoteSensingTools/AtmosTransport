# ===========================================================================
# Tropopause isolation experiment — run C: ADVECTION ONLY (no diffusion, no convection).
#
# Pure PPM advection baseline — vertical diffusion AND convection both DISABLED.
# Single tracer co2_natural (LMDZ surface flux), Dec 1-5 2021, GEOS-IT C180
# full-L72 pinned transport binaries. Baseline for the diffusion-only
# (`..._diffonly_...`) and convection-only (`..._convonly_...`) runs: shows what
# resolved advection alone does at the tropopause before any sub-grid physics is
# added. Emissions still inject at the surface (the surface-flux operator always
# applies the full flux; with both diffusion and convection off it is the only
# vertical-redistribution term besides advection).
#
# Runner:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/catrine_geosit_c180_ppm_advonly_co2nat_dec1-5.toml
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72"
start_date   = "2021-12-01"
end_date     = "2021-12-05"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"
  time_varying = true

[diffusion]
kind = "none"

[convection]
kind = "none"

[chemistry]
kind = "none"

[output]
format = "netcdf"
split = "single"
snapshot_interval_hours = 3
path = "~/data/AtmosTransport/output/tropopause_iso/catrine_geosit_c180_ppm_advonly_co2nat_dec1-5.nc"
