# F32 no-flux: advection + DIFFUSION + CONVECTION (full transport, no flux/chem).
# The full F32 transport stack of the production campaign minus the surface flux.
# Total SF6 mass MUST be constant; the net F32 background drift here is the SUM of
# all three operators' leaks and should equal the bulk of the ~2.5% emission
# "deficit" once divided by the (small) 2-day emission. Single-tracer SF6.
[architecture]
use_gpu = true
backend = "cuda"
[numerics]
float_type = "Float32"
[input]
folder       = "~/data/AtmosTransport/met/geosit/C180/transport_binary_dec2021_catrine_f32_fullL72_omega"
start_date   = "2021-12-01"
end_date     = "2021-12-04"
file_pattern = "geos_transport_{YYYYMMDD}_float32.bin"
[advection]
scheme = "ppm"
[tracers.sf6]
  [tracers.sf6.init]
  kind = "file"
  file = "~/data/AtmosTransport/catrine/InitialConditions/startSF6_202112010000.nc"
  variable = "SF6"
[diffusion]
kind = "geoschem_holtslag_boville_vdiff"
surface_flux_boundary = false
[convection]
kind = "cmfmc_matrix"
tile_workspace_gib = 0.25
use_collab_lu = true
lmax_conv = 0
[chemistry]
kind = "none"
[output]
snapshot_interval_hours = 3
snapshot_file = "~/data/AtmosTransport/output/conservation_test/f32_noflux_adv_diff_conv_dec1-4.nc"
