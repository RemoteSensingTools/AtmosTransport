# ===========================================================================
# ERA5 spectral-wind N320->C180 — FULL PHYSICS, Dec 1-3 2021.
#
# The clean reference path, now apples-to-apples with the GEOS-Chem reference
# (advection + convection + diffusion). Full-physics counterpart of the
# adv-only `route1_dec1-5/era5_advonly_co2nat_dec1-5.toml`: same Dec-1 IC
# (catrine_co2), same lmdz_co2 time-varying surface flux, same PPM scheme.
#
# The ERA5 binary carries DIFFERENT sub-grid physics inputs than the GEOS
# binaries:
#   - convection: precomputed TM5 entrainment (entu/detu/entd/detd), NOT
#     CMFMC -> use [convection] kind = "tm5".
#   - diffusion:  precomputed TM5 Kz (:kz section) -> kind = "precomputed_kz".
# Single tracer co2_natural (passive — chemistry = none).
#
# Runner:
#   julia --project=. scripts/run_transport.jl \
#       config/runs/fullphys_dec1-3/era5_fullphys_co2nat_dec1-3.toml
# ===========================================================================

[architecture]
use_gpu = true
backend = "cuda"

[numerics]
float_type = "Float32"

[input]
folder       = "~/data/AtmosTransport/met/era5/n320_to_c180/transport_binary_dec2021_catrine_f32"
start_date   = "2021-12-01"
end_date     = "2021-12-03"
file_pattern = "era5_n320_transport_{YYYYMMDD}_float32.bin"

[advection]
scheme = "ppm"

[tracers.co2_natural]
  [tracers.co2_natural.init]
  kind = "catrine_co2"
  [tracers.co2_natural.surface_flux]
  kind = "lmdz_co2"
  time_varying = true
  temporal_scheme = "stepwise"   # GC/HEMCO piecewise-constant CAMS hold (parity)

[diffusion]
kind = "precomputed_kz"

[convection]
kind = "tm5"
use_collab_lu = true

[chemistry]
kind = "none"

[output]
format = "netcdf"
split = "single"
snapshot_interval_hours = 3
path = "~/data/AtmosTransport/output/route1_dec1-5/era5_fullphys_co2nat_dec1-3.nc"
