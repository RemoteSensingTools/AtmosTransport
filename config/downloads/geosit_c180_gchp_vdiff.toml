# ===========================================================================
# GEOS-IT C180 cubed-sphere download with GCHP Holtslag-Boville VDIFF inputs
#
# Adds I3 (T) to the standard transport + surface + convection request.
# The binary preprocessor uses:
#   CTM_A1/CTM_I1: mass, fluxes, PS, QV
#   A1:            PBLH, USTAR, HFLUX, T2M
#   A3dyn:         U, V, DTRAIN
#   A3mstE:        CMFMC
#   I3:            T
#
# Usage:
#   julia --project=. scripts/downloads/download_data.jl \
#       config/downloads/geosit_c180_gchp_vdiff.toml \
#       --start 2021-12-01 --end 2021-12-05
# ===========================================================================

[source]
met_source = "config/met_sources/geosit.toml"

[download]
protocol = "s3"
bucket = "geos-chem"
prefix = "GEOS_C180/GEOS_IT"
no_sign_request = true

[[download.requests]]
name = "transport_gchp_vdiff"
description = "CTM transport + surface + convection + GCHP Holtslag-Boville VDIFF inputs"
collections = ["CTM_A1", "CTM_I1", "A1", "A3dyn", "A3mstE", "I3"]

[output]
data_root = "~/data/AtmosTransport"
met_source = "geosit"
grid_name = "C180"
cadence = "daily"
payload_type = "raw"
subdirectory_by_date = true

[schedule]
start_date = "2021-12-01"
end_date = "2023-12-31"
chunk = "per_file"

[options]
max_concurrent = 4
max_retries = 3
retry_wait_seconds = 30
skip_existing = true
